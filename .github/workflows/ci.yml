name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # One build: the marketing routes are prerendered inside the PWA build.
      - run: npm run build -w apps/web

  # [P43-5] The landing page in a real browser at 390px: six use-case cards, no horizontal overflow, 1/2/3 columns
  # (phone/tablet/desktop). The unit suite reads the HTML but cannot lay it out. Runs in parallel with `verify`;
  # deploy waits for the whole CI workflow, so a broken landing layout never ships. No secrets, no cloud.
  landing-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the web app and serves it with `vite preview` (webServer).
      # [P46-6b] The app at 390px with real lengths (long promise text, long names): no sideways scroll on Promises, the
      # client page, Inventory or Settings. Stub API, no server, no secrets.
      - run: npx playwright test apps/web/e2e/landing-usecases.spec.ts apps/web/e2e/app-layout.spec.ts

  # The unit suite runs migrations against a FAKE client that never executes SQL, so anything real
  # Postgres rejects at apply time — an FK whose column type doesn't match its referent, a grant to a
  # missing role, an RLS predicate that won't type-check — slips through and only dies on the prod boot
  # (then ECS rolls the deploy back). 0067's `user_id text REFERENCES users(id)` (users.id is uuid) did
  # exactly that. This job runs the REAL migration set against a REAL Postgres so that class fails in CI.
  # It runs in PARALLEL with `verify` (adds ~0 wall-clock; ~1-2 min on its own runner), and `gate` needs
  # it — so a broken migration never spends the model gate or reaches deploy.
  migrations-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tovira
          POSTGRES_PASSWORD: tovira
          POSTGRES_DB: tovira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tovira -d tovira"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply every migration against real Postgres (fresh schema)
        env:
          MIGRATIONS_TEST_DB_URL: postgres://tovira:tovira@localhost:5432/tovira
        run: npx vitest run apps/api/src/db/migrations-real-postgres.test.ts

  # The P1-9 extraction quality gate (Sonnet vs Haiku). It needs a real model
  # key, so it self-activates: a no-op until ANTHROPIC_API_KEY is in the repo
  # secrets, then it fails the build if extraction ever guesses a date /
  # fabricates a promise / merges two people. Runs on main only (it spends).
  #
  # [P25-2] Fabrication FAILS this job: every gate run (re-runs included) appends one record to the
  # append-only ledger on the `gate-ledger` branch (fab-ledger.jsonl), and the gate pools the most recent
  # same-key records (prompt version + model + extraction fingerprint) to >= 960 extractions; pooled > 1.2%
  # fails, and a single run > 3% fails at once. A missing/unreadable ledger fails CLOSED. Gate jobs are
  # serialised so each one reads the ledger after the previous run's record has landed.
  # [P26-3] The job first appends a "started" record; a start with no result (a job cancelled or killed
  # before it scored) counts as a FAILURE while it is in the window.
  gate:
    needs: [verify, migrations-pg]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to append this run's record to the gate-ledger branch
    concurrency:
      group: fab-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record that this gate run started (before any model call)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_PROVIDER: anthropic
          DATABASE_URL: postgres://gate:gate@localhost:5432/gate
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            # [P52 · owner] fail closed: no key, no gate, no deploy, whatever changed
            echo "::error::No ANTHROPIC_API_KEY secret set: the gate cannot run, so this commit cannot deploy (FAIL, closed)."
            exit 1
          fi
          npx tsx apps/api/src/eval/fab-started.ts > "$RUNNER_TEMP/fab-started.jsonl"
          scripts/ops/append-fab-ledger.sh "$RUNNER_TEMP/fab-started.jsonl" "gate started: ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
      - name: Run the extraction gate (only when a key is configured)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_PROVIDER: anthropic
          # The eval only calls loadConfig() + the model client — it never opens a
          # DB connection. loadConfig requires DATABASE_URL to be present, so give
          # it a syntactically valid dummy that is never dialed.
          DATABASE_URL: postgres://gate:gate@localhost:5432/gate
          GATE_LEDGER_REQUIRED: '1'
          GATE_LEDGER_FILE: ${{ runner.temp }}/fab-ledger.jsonl
          GATE_LEDGER_OUT: ${{ runner.temp }}/fab-record.jsonl
          GATE_VERDICT_OUT: ${{ runner.temp }}/verdict.jsonl # [P52] this run's verdict, for the deploy ledger
          GATE_DEPLOY_LEDGER_FILE: ${{ runner.temp }}/deploy-ledger.jsonl # [P55-1] a failed certification forces another
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::No ANTHROPIC_API_KEY secret set: the P1-9 gate cannot run (FAIL, closed)."
            exit 1
          fi
          # Fail closed: no ledger branch / no ledger file → the gate refuses to run.
          git fetch --no-tags --depth=1 origin gate-ledger || { echo "FABRICATION LEDGER: the gate-ledger branch is missing — FAIL (closed)"; exit 1; }
          git show FETCH_HEAD:fab-ledger.jsonl > "$GATE_LEDGER_FILE" || { echo "FABRICATION LEDGER: fab-ledger.jsonl is missing — FAIL (closed)"; exit 1; }
          if git cat-file -e FETCH_HEAD:deploy-ledger.jsonl 2>/dev/null; then git show FETCH_HEAD:deploy-ledger.jsonl > "$GATE_DEPLOY_LEDGER_FILE"; else : > "$GATE_DEPLOY_LEDGER_FILE"; fi
          npm run gate
      - name: Append this run to the fabrication ledger (whatever the verdict)
        if: always()
        env:
          RECORD: ${{ runner.temp }}/fab-record.jsonl
        run: |
          if [ ! -s "$RECORD" ]; then
            echo "No fabrication result (the gate was skipped or stopped before scoring) — its started record stands as a failure."
            exit 0
          fi
          scripts/ops/append-fab-ledger.sh "$RECORD" "gate: ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
      # [P52 · owner] The verdict (deploy gate, certification PASS / PROVISIONAL / FAIL, every counter) is kept permanently
      # on the gate ledger: deploy.yml refuses a commit whose latest verdict is a FAIL, or that has no verdict at all.
      - name: Append this run's verdict to the deploy ledger (whatever the result)
        if: always()
        env:
          VERDICT: ${{ runner.temp }}/verdict.jsonl
        run: |
          if [ ! -s "$VERDICT" ]; then
            echo "No verdict (the gate stopped before scoring): none recorded, so this commit cannot deploy."
            exit 0
          fi
          TARGET_FILE=deploy-ledger.jsonl scripts/ops/append-fab-ledger.sh "$VERDICT" "verdict: ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"

  # [P52 · owner] Every CI job passed for this commit: recorded permanently, so a manual deploy (or a rollback to an older
  # green commit) can be checked long after CI artifacts expire.
  record-green:
    needs: [verify, migrations-pg, landing-e2e, gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fab-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Append the CI-green record to the deploy ledger
        run: |
          npx tsx apps/api/src/eval/deploy-record.ts ci-green > "$RUNNER_TEMP/ci-green.jsonl"
          TARGET_FILE=deploy-ledger.jsonl scripts/ops/append-fab-ledger.sh "$RUNNER_TEMP/ci-green.jsonl" "ci green: ${GITHUB_SHA::7} run ${GITHUB_RUN_ID}"
