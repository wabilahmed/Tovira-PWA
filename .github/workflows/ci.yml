name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Build the product PWA and the marketing site side by side — a broken
      # build in either fails CI. They deploy independently, but both must build.
      - run: npm run build -w apps/web
      - run: npm run build:site
