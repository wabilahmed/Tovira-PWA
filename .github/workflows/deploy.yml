name: Deploy

# Auto-deploys after CI passes on main (never on a red suite — it waits for the
# "CI" workflow to finish and only proceeds when its conclusion is success). Still
# manually runnable from the Actions tab (pick api / web / both). Authenticates to
# AWS via OIDC (no long-lived keys). Prerequisites (one-time), see DEPLOY.md:
#   - Terraform applied (ECR, ECS, RDS, S3+CloudFront, Secrets Manager, …).
#   - A GitHub OIDC deploy role in AWS  → secret  AWS_DEPLOY_ROLE_ARN
#   - Repo variables: AWS_REGION, DEPLOY_ENV, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
on:
  # Chain after CI: a push to main runs "CI" (typecheck/lint/test/build + the
  # P1-9 gate); when that succeeds, this deploys. A failed suite → no deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: both
        options: [both, api, web]

concurrency:
  group: deploy-${{ vars.DEPLOY_ENV || 'prod' }}
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'prod' }}
  ECR_REPOSITORY: tovira/api # matches infra/terraform/ecr.tf
  # The exact commit CI verified (head_sha on the auto path, dispatch sha manually)
  # — tag the image and check out with the SAME sha so we deploy what was tested.
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    # Auto (after a green CI) → deploy; manual → honor the target picker.
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
          || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'api')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS task runs on ARM64 (Graviton), so the image must be arm64. The
      # runner is amd64, so cross-build with QEMU + buildx.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image (arm64, matches Graviton Fargate)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${IMAGE_SHA}"
          # ECR tags are immutable — only push if this exact version isn't there
          # yet (makes re-runs of the same commit safe). No 'latest' tag.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${IMAGE_SHA}" >/dev/null 2>&1; then
            echo "image ${IMAGE_SHA} already in ECR — reusing it"
          else
            docker buildx build --platform linux/arm64 -f docker/api.prod.Dockerfile -t "$IMAGE" --push .
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render the current task definition with the new image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "tovira-${DEPLOY_ENV}-api" \
            --query 'taskDefinition' --output json \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > taskdef.json

      - name: Fill in the image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: api # matches infra/terraform/ecs.tf
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS (migrations run on boot) and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: tovira-${{ env.DEPLOY_ENV }}-api
          cluster: tovira-${{ env.DEPLOY_ENV }}
          wait-for-service-stability: true

      - name: Smoke test — public health via CloudFront → ALB
        if: ${{ vars.SMOKE_URL != '' }}
        run: |
          # A fresh ARM task cold-starts + the ALB needs ~2 healthy checks before
          # it routes, so give it up to ~6 minutes.
          for i in $(seq 1 24); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.SMOKE_URL }}/api/health" || true)
            echo "attempt $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::/api/health never returned 200 through CloudFront"; exit 1

  web:
    # Auto (after a green CI) → deploy; manual → honor the target picker.
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
          || (github.event_name == 'workflow_dispatch' && (inputs.target == 'both' || inputs.target == 'web')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build the PWA (marketing routes are prerendered inside it)
        run: npm run build -w apps/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync apps/web/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: Smoke test — the app shell and landing load
        if: ${{ vars.SMOKE_URL != '' }}
        run: |
          for path in / /app; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.SMOKE_URL }}${path}" || true)
            echo "$path → $code"
            [ "$code" = "200" ] || { echo "::error::$path did not return 200"; exit 1; }
          done
