name: Deploy

# Auto-deploys after CI passes on main (never on a red suite — it waits for the
# "CI" workflow to finish and only proceeds when its conclusion is success). Still
# manually runnable from the Actions tab (pick api / web / both). Authenticates to
# AWS via OIDC (no long-lived keys). Prerequisites (one-time), see DEPLOY.md:
#   - Terraform applied (ECR, ECS, RDS, S3+CloudFront, Secrets Manager, …).
#   - A GitHub OIDC deploy role in AWS  → secret  AWS_DEPLOY_ROLE_ARN
#   - Repo variables: AWS_REGION, DEPLOY_ENV, FRONTEND_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
on:
  # Chain after CI: a push to main runs "CI" (typecheck/lint/test/build + the
  # P1-9 gate); when that succeeds, this deploys. A failed suite → no deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: both
        options: [both, api, web]
      # [P52 · owner] Deploy an older commit (a rollback): it must have a CI-green record and no certification FAIL.
      sha:
        description: Commit to deploy (blank = the branch head)
        type: string
        required: false
      # [P52 · owner] Force past the rules: needs a reason, is recorded (who, when, why) and emails ADMIN_EMAILS.
      force:
        description: Force this deploy past the release checks
        type: boolean
        default: false
      reason:
        description: Why (required with force, at least 10 characters)
        type: string
        required: false

concurrency:
  group: deploy-${{ vars.DEPLOY_ENV || 'prod' }}
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: write # [P52] the decide job appends a forced deploy to the gate ledger
  actions: read # [P52] a commit from before the deploy ledger: GitHub's CI result for it

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'prod' }}
  ECR_REPOSITORY: tovira/api # matches infra/terraform/ecr.tf

jobs:
  # [P52 · owner] One decision gates both halves. Auto: CI green and the commit's latest gate verdict has no
  # certification FAIL (PROVISIONAL allowed for now). Manual: a CI-green record and no FAIL (an older commit is a
  # rollback). Forced: a reason, recorded and emailed. No verdict, an unreadable ledger or any error refuses.
  decide:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    concurrency:
      group: fab-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The commit to deploy
        id: sha
        env:
          WANT: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
        run: |
          SHA=$(git rev-parse --verify "${WANT}^{commit}") || { echo "::error::Unknown commit ${WANT}"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Read the deploy ledger (fail closed)
        run: |
          git fetch --no-tags origin gate-ledger || { echo "::error::The gate-ledger branch is missing: refusing (closed)"; exit 1; }
          if git cat-file -e FETCH_HEAD:deploy-ledger.jsonl 2>/dev/null; then git show FETCH_HEAD:deploy-ledger.jsonl > "$RUNNER_TEMP/deploy-ledger.jsonl"; else : > "$RUNNER_TEMP/deploy-ledger.jsonl"; fi
      - name: A commit from before the deploy ledger (manual only)
        id: legacy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&status=success&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI")] | length')
          echo "green=$([ "${n:-0}" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Decide
        env:
          TRIGGER: ${{ github.event_name == 'workflow_run' && 'auto' || 'manual' }}
          SHA: ${{ steps.sha.outputs.sha }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          LEDGER_FILE: ${{ runner.temp }}/deploy-ledger.jsonl
          LEGACY_CI_GREEN: ${{ steps.legacy.outputs.green }}
          FORCE: ${{ inputs.force }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          DEPLOY_POLICY: pass-required # [P56-3 · owner] PROVISIONAL deploys only when the latest certification of its CERT_SURFACE is a PASS
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          FORCED_OUT: ${{ runner.temp }}/forced.jsonl
        run: |
          npx tsx apps/api/src/eval/deploy-decide.ts
          if [ -s "$FORCED_OUT" ]; then
            TARGET_FILE=deploy-ledger.jsonl scripts/ops/append-fab-ledger.sh "$FORCED_OUT" "forced deploy: ${SHA::7} by ${ACTOR}"
          fi

  api:
    needs: decide
    # Only on the decision; manual → honor the target picker.
    if: >-
      ${{ needs.decide.result == 'success'
          && (github.event_name == 'workflow_run' || inputs.target == 'both' || inputs.target == 'api') }}
    runs-on: ubuntu-latest
    env:
      # The exact commit the decision approved: tag the image and check out with the SAME sha.
      IMAGE_SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The ECS task runs on ARM64 (Graviton), so the image must be arm64. The
      # runner is amd64, so cross-build with QEMU + buildx.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push the API image (arm64, matches Graviton Fargate)
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${IMAGE_SHA}"
          # ECR tags are immutable — only push if this exact version isn't there
          # yet (makes re-runs of the same commit safe). No 'latest' tag.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${IMAGE_SHA}" >/dev/null 2>&1; then
            echo "image ${IMAGE_SHA} already in ECR — reusing it"
          else
            docker buildx build --platform linux/arm64 -f docker/api.prod.Dockerfile -t "$IMAGE" --push .
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render the current task definition with the new image
        id: taskdef
        run: |
          aws ecs describe-task-definition \
            --task-definition "tovira-${DEPLOY_ENV}-api" \
            --query 'taskDefinition' --output json \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > taskdef.json

      - name: Fill in the image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: api # matches infra/terraform/ecs.tf
          image: ${{ steps.build.outputs.image }}
          # Stamp the deployed commit so GET /version reports the real build (not "unknown").
          # "What is staging running" should be a curl, not an investigation (FAB-INVESTIGATE).
          environment-variables: |
            BUILD_SHA=${{ env.IMAGE_SHA }}

      - name: Deploy to ECS (migrations run on boot) and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: tovira-${{ env.DEPLOY_ENV }}-api
          cluster: tovira-${{ env.DEPLOY_ENV }}
          wait-for-service-stability: true

      - name: Smoke test — public health via CloudFront → ALB
        if: ${{ vars.SMOKE_URL != '' }}
        run: |
          # A fresh ARM task cold-starts + the ALB needs ~2 healthy checks before
          # it routes, so give it up to ~6 minutes.
          for i in $(seq 1 24); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.SMOKE_URL }}/api/health" || true)
            echo "attempt $i → $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::/api/health never returned 200 through CloudFront"; exit 1

  web:
    # [P52 · owner] Only on the decision, and never ahead of the API: web waits for the api job to succeed (a manual
    # web-only deploy, where api is skipped, is the one exception).
    needs: [decide, api]
    if: >-
      ${{ always() && needs.decide.result == 'success'
          && (needs.api.result == 'success'
              || (github.event_name == 'workflow_dispatch' && inputs.target == 'web' && needs.api.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build the PWA (marketing routes are prerendered inside it)
        run: npm run build -w apps/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Cache-Control is the fix for "returning users see a stale build after deploy": the old blanket
      # sync set NO Cache-Control, so CloudFront's CachingOptimized applied its 24h default and the
      # browser cached sw.js/index.html heuristically — so the service worker never fetched a fresh
      # sw.js and the landing stayed stale (a private window, with no cache/SW, got the new one). Two
      # passes fix it: hashed assets cache forever (immutable), everything else revalidates every load.
      - name: Sync to S3 (hashed assets immutable, everything else no-cache)
        run: |
          # 1) Content-hashed assets (/assets/*-[hash].*) → cache forever + immutable. NO --delete here:
          #    a client still on the PREVIOUS index.html must not 404 on its old asset URLs mid-rollout
          #    (an S3 lifecycle rule prunes old assets later). Content-addressed, so this is always safe.
          aws s3 sync apps/web/dist/assets "s3://${{ vars.FRONTEND_BUCKET }}/assets" \
            --cache-control 'public, max-age=31536000, immutable'
          # 2) Everything else (index.html, app.html, the marketing HTML, sw.js, the .webmanifest, icons)
          #    → no-cache so the browser revalidates EVERY load and a new release reaches returning users
          #    without them clearing data. --delete prunes files dropped from the build; exclude assets/
          #    so this pass never re-headers or deletes the immutable set above.
          aws s3 sync apps/web/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --cache-control 'no-cache' \
            --exclude 'assets/*'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'

      - name: Smoke test — the app shell and landing load
        if: ${{ vars.SMOKE_URL != '' }}
        run: |
          for path in / /app; do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ vars.SMOKE_URL }}${path}" || true)
            echo "$path → $code"
            [ "$code" = "200" ] || { echo "::error::$path did not return 200"; exit 1; }
          done
