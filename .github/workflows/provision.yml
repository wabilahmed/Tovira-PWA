name: Provision (Terraform)

# Manual only. Runs `terraform plan` / `apply` for the whole stack via AWS OIDC
# (no static keys), using the roles + state bucket created by scripts/aws-bootstrap.sh.
# Remote state is configured at runtime (a backend.tf is written here) so the
# committed Terraform stays untouched. Gate `apply` with a required reviewer by
# protecting the `production` environment in repo settings.
on:
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        type: choice
        default: plan
        options: [plan, apply]

concurrency:
  group: provision-${{ vars.DEPLOY_ENV || 'prod' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  DEPLOY_ENV: ${{ vars.DEPLOY_ENV || 'prod' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.action == 'apply' && 'production' || '' }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PROVISION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure remote state (S3 backend) at runtime
        run: printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=tovira/${DEPLOY_ENV}.tfstate" \
            -backend-config="region=${AWS_REGION}"

      - name: terraform fmt + validate
        run: |
          terraform fmt -check -recursive || true
          terraform validate

      # [P26-1] Plan with the image the service is RUNNING — never a placeholder. variables.tf refuses
      # anything that is not the tovira/api ECR image.
      - name: Read the live API image
        id: live
        run: |
          TD="$(aws ecs describe-services --cluster "tovira-${DEPLOY_ENV}" --services "tovira-${DEPLOY_ENV}-api" --query 'services[0].taskDefinition' --output text)"
          IMG="$(aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.containerDefinitions[0].image' --output text)"
          case "$IMG" in
            *.dkr.ecr.*.amazonaws.com/tovira/api:*|*.dkr.ecr.*.amazonaws.com/tovira/api@sha256:*) ;;
            *) echo "::error::live API image is '$IMG' — refusing to plan"; exit 1 ;;
          esac
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: terraform plan
        run: |
          terraform plan -input=false \
            -var="region=${AWS_REGION}" \
            -var="env=${DEPLOY_ENV}" \
            -var="api_image=${{ steps.live.outputs.image }}" \
            -out=tfplan
        # [P30] The domains (tovira.io + legacy staging.tovira.io) come from prod.auto.tfvars only — a -var here
        # would override it (the old MARKETING_DOMAIN repo var still says staging). The cert is managed (acm.tf).

      - name: terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -input=false tfplan

      - name: Show key outputs (after apply)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          echo "Set these repo variables from the outputs below:"
          terraform output -raw frontend_bucket && echo "  → FRONTEND_BUCKET"
          terraform output -raw ecr_repository_url || true
