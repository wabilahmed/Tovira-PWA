<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1512" media="(prefers-color-scheme: dark)" />
    <title>Tovira</title>
    <!-- The Private Vault typeface system (Fraunces + IBM Plex Sans/Arabic/Mono)
         is self-hosted via @fontsource and imported in main.tsx — no CDN. -->
    <!-- Pin the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('tovira.theme');
          if (t === 'vault' || t === 'ledger') document.documentElement.setAttribute('data-theme', t);
          // First run (no saved choice) defaults to Ledger (light), even on a dark
          // device. Only an explicit 'system' choice follows the OS.
          else if (t !== 'system') document.documentElement.setAttribute('data-theme', 'ledger');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
