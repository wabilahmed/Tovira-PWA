<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" />
    <title>Tovira</title>
    <!-- The site's fonts (Fraunces, Inter, JetBrains Mono; IBM Plex Sans Arabic for Arabic) are self-hosted and
         imported in main.tsx, no CDN (P71-F). -->
    <script>
      // [P71-D · owner] Pin the theme before first paint. No saved choice: Dark. A saved Light, Dark or Auto is kept.
      // [P74 · owner] ...but only inside the signed-in app: every page a signed-out visitor can reach is always the public
      // look, [P89 · owner] now Marker (was Dark)
      // (request access, reset password, invite, verify email, the admin console, the billing pages, a 404, and the
      // sign-in, i.e. /app until someone has signed in on this browser). Same decision as initTheme() in theme.ts.
      // The theme-color (address bar, installed app's status bar) follows it: #171412 dark, #f4f1ea light.
      (function () {
        // [P89 · owner, Prompt 86] TEMPORARY until the CloudFront routing for the game pages is applied (provision
        // workflow): a clean game address reaches the app shell, so send it to the static page's own file. Remove once
        // the live /game returns the game page itself (BLOCKERS [P89-routing]).
        var gp = location.pathname.replace(/\/$/, '');
        if (/^\/game(\/(property|insurance|wealth|b2b|luxury|recruitment))?$/.test(gp)) {
          location.replace(gp + '/index.html' + location.search + location.hash);
          return;
        }
        var t = 'marker';
        try {
          var p = location.pathname;
          if ((p === '/app' || p === '/') && localStorage.getItem('tovira.signedIn') === '1') {
            var s = localStorage.getItem('tovira.theme');
            t = s === 'ledger' || s === 'vault' || s === 'system' ? s : 'vault';
          }
        } catch (e) {}
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
        var deviceDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          var media = metas[i].getAttribute('media') || '';
          var dark = t === 'vault' || (t === 'system' && (media ? media.indexOf('dark') !== -1 : deviceDark));
          metas[i].setAttribute('content', t === 'marker' ? '#FAFAFA' : dark ? '#171412' : '#f4f1ea');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
