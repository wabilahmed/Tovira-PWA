# Opt-in override: run the stack against the REAL providers using the keys in
# your root .env (Compose auto-loads .env for ${VAR} substitution). This file
# holds only variable references — no secrets.
#
#   docker compose -f docker-compose.yml -f docker-compose.real-ai.yml up
#
# Without this file, `docker compose up` uses deterministic STUBS (no keys, no
# spend). Embeddings + push stay stubbed here (no AWS creds / VAPID keys locally).
services:
  api:
    environment:
      # Extraction via real Claude (Sonnet 5 — the model that passed the P1-9 gate).
      MODEL_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Transcription via real Groq/Whisper.
      TRANSCRIBER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      GROQ_MODEL: ${GROQ_MODEL:-whisper-large-v3}
      # Billing via Stripe TEST mode.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
